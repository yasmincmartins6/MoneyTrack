<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803d">
  <title>MoneyTrack | Criar conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="login-card" aria-labelledby="page-title">
      <a class="brand" href="index.html" aria-label="MoneyTrack - voltar ao login">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h13a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H6a2.5 2.5 0 0 1-2.5-2.5v-10Z" stroke="currentColor" stroke-width="1.8"/>
            <path d="M3.5 8H18a2 2 0 0 1 2 2v1h-4a2.5 2.5 0 0 0 0 5h4" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <circle cx="16" cy="13.5" r=".9" fill="currentColor"/>
          </svg>
        </span>
        <span>Money<span class="brand-accent">Track</span></span>
      </a>

      <div class="heading">
        <div class="welcome-icon" aria-hidden="true">＋</div>
        <h1 id="page-title">Crie sua conta</h1>
        <p>Comece a organizar suas receitas, despesas e metas.</p>
      </div>

      <form id="signup-form" novalidate>
        <div class="field">
          <label for="name">Nome completo</label>
          <input id="name" name="name" type="text" placeholder="Digite seu nome" autocomplete="name" required>
          <small class="field-error" id="name-error"></small>
        </div>
        <div class="field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" placeholder="Digite seu e-mail" autocomplete="email" required>
          <small class="field-error" id="email-error"></small>
        </div>
        <div class="field">
          <label for="password">Senha</label>
          <div class="password-wrap">
            <input id="password" name="password" type="password" placeholder="Mínimo de 8 caracteres" autocomplete="new-password" required>
            <button class="password-toggle" type="button" data-toggle="password" aria-label="Mostrar senha" aria-pressed="false">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z" stroke="currentColor" stroke-width="1.7"/>
                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </div>
          <small class="field-error" id="password-error"></small>
        </div>
        <div class="field">
          <label for="confirm">Confirmar senha</label>
          <input id="confirm" name="confirm" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" required>
          <small class="field-error" id="confirm-error"></small>
        </div>
        <label class="remember terms">
          <input type="checkbox" id="accept-terms">
          <span>Entendo que esta é uma versão demonstrativa local.</span>
        </label>
        <small class="field-error" id="terms-error"></small>
        <p class="status-message" id="signup-status" role="status" aria-live="polite"></p>
        <button class="submit-button" type="submit" id="submit-button"><span>Criar conta</span><span aria-hidden="true">→</span></button>
      </form>

      <p class="signup-prompt back-link">Já possui uma conta? <a href="index.html">Entrar</a></p>
      <p class="privacy-note"><span aria-hidden="true">●</span> Demonstração local — não use uma senha real.</p>
    </section>
    <footer>MoneyTrack <span aria-hidden="true">·</span> Controle financeiro pessoal</footer>
  </main>
  <script src="cadastro.js"></script>
</body>
</html>
